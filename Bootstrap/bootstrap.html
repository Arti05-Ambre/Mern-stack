<body>
       <div class="container">
        <h2>Form Demo</h2>
        <form>
        <div class="row">
          <div class="mb-3 col">
           <label class="form-label" for="email">Email</label>
            <input type="text" class="form-control" placeholder="Email" id="email">
           </div>
    <div class="mb-3 col">
     <label class="form-label" for="password">Password</label>
    <input type="password" class="form-control" placeholder="password" id="password">
    </div>
    </div>
    <div class="mb-3">
     <label class="form-label" for="Address">Address</label>
    <input type="text" class="form-control" placeholder="Address" id="Address">
    </div>
    <div class="mb-3">
        <select class="form-select" >
            <option selected>select your class</option>
            <option value="1">BCS</option>
             <option value="2">MCS</option>
              <option value="3">B.Com</option>
               <option value="4">BCA</option>
        </select>
    </div>
<div class="normal mb-3">
    
    <input type="checkbox" id="agree">
    <label for="agree"> I Agree</label>
</div>
<div class=" form-check mb-3">
    <input class="form-check-input" type="checkbox" id="agreebs">
     <label class= "form-check-label" for="agreebs"> I Agree</label>
</div>
<div class=" form-check mb-3">
    <input class="form-check-input" type="radio" id="agreebs">
     <label class= "form-check-label" for="agreebs"> yes/no</label>
</div>
<div class=" form-check form-switch  mb-3">
    <input class="form-check-input" type="checkbox" id="agreebs" role="switch">
     <label class= "form-check-label" for="agreebs"> yes/no</label>
</div>



    </form>
